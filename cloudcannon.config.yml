# ===========================================================================
# Snippets — MDX components editors can insert into blog post bodies
# ===========================================================================
_snippets:
  logo:
    template: mdx_component
    inline: false
    preview:
      text: Logo
      icon: bolt
    definitions:
      component_name: Logo
  youtube:
    template: mdx_component
    inline: false
    preview:
      text: YouTube video
      icon: smart_display
    definitions:
      component_name: YouTube
    _inputs:
      id:
        type: text
        comment: YouTube video ID
  tweet:
    template: mdx_component
    inline: false
    preview:
      text: Tweet
      icon: chat
    definitions:
      component_name: Tweet
    _inputs:
      id:
        type: text
        comment: Full tweet URL
  vimeo:
    template: mdx_component
    inline: false
    preview:
      text: Vimeo video
      icon: smart_display
    definitions:
      component_name: Vimeo
    _inputs:
      id:
        type: text
        comment: Vimeo video ID

# ===========================================================================
# Collections
# ===========================================================================
collections_config:
  pages:
    path: src/content/pages
    glob:
      - '*.md'
      - '!homes/**'
      - '!landing/**'
    url: '/[slug]/'
    icon: wysiwyg
    name: Pages
    _enabled_editors:
      - visual
      - data
    schemas:
      page_builder:
        path: .cloudcannon/schemas/page-builder.md
        name: Page
        new_preview_url: /services/
    add_options:
      - name: New page
        schema: page_builder
        icon: note_add

  homes:
    path: src/content/pages/homes
    url: '/homes/[slug]/'
    icon: home
    name: Homepages
    _enabled_editors:
      - visual
      - data
    schemas:
      page_builder:
        path: .cloudcannon/schemas/page-builder.md
        name: Homepage
        new_preview_url: /homes/saas/
    add_options:
      - name: New homepage
        schema: page_builder
        icon: note_add

  landing:
    path: src/content/pages/landing
    url: '/landing/[slug]/'
    icon: dashboard
    name: Landing pages
    _enabled_editors:
      - visual
      - data
    schemas:
      page_builder:
        path: .cloudcannon/schemas/page-builder.md
        name: Landing page
        new_preview_url: /landing/sales/
    add_options:
      - name: New landing page
        schema: page_builder
        icon: note_add

  legal:
    path: src/content/legal
    url: '/[slug]/'
    icon: gavel
    name: Legal
    _enabled_editors:
      - content
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/legal.md
        name: Legal page
    add_options:
      - name: New legal page
        schema: default
        editor: content
        icon: note_add
    _inputs:
      title:
        type: text
      metadata:
        type: object
        options:
          preview:
            icon: search

  post:
    path: src/data/post
    url: '/[slug]/'
    icon: post_add
    name: Blog
    _enabled_editors:
      - content
      - data
    add_options:
      - name: New post
        editor: content
        icon: post_add
    _inputs:
      title:
        type: text
      excerpt:
        type: textarea
      publishDate:
        type: datetime
      updateDate:
        type: datetime
      draft:
        type: switch
      image:
        type: image
      category:
        type: text
      tags:
        type: array
      author:
        type: text
      metadata:
        type: object
        options:
          preview:
            icon: search

  data:
    path: src/data
    glob:
      - '**/*.json'
    disable_url: true
    icon: settings
    name: Site data
    _enabled_editors:
      - data

# ===========================================================================
# Data config — exposes data files for use elsewhere (e.g. select inputs)
# ===========================================================================
data_config:
  navigation:
    path: src/data/navigation.json

# ===========================================================================
# Sidebar grouping
# ===========================================================================
collection_groups:
  - heading: Pages
    collections:
      - pages
      - homes
      - landing
      - legal
  - heading: Blog
    collections:
      - post
  - heading: Settings
    collections:
      - data

# ===========================================================================
# Per-file input config for data files (navigation editing)
# ===========================================================================
file_config:
  - glob: src/data/navigation.json
    _inputs:
      header:
        type: object
        options:
          preview:
            icon: menu
      footer:
        type: object
        options:
          preview:
            icon: call_to_action
      footNote:
        type: html
