# ---------------------------------------------------------------------------
# Page-builder block list. Shared by pages / homes / landing collections.
# ---------------------------------------------------------------------------
_inputs:
  content_blocks:
    type: array
    label: Page sections
    options:
      structures: _structures.content_blocks
    comment: Add, reorder and remove the sections that make up this page.

# ---------------------------------------------------------------------------
# Editor toolbars
# ---------------------------------------------------------------------------
_editables:
  # Inline rich text. Drives on-page `data-editable="text"` regions AND the
  # sidebar `type: html` inputs that mirror them (via the *inline_richtext
  # anchor below) so both toolbars expose the same options.
  # `styles` is required here too: beyond rendering, it populates the Styles
  # dropdown (selectors in `element.class` form, e.g. `span.accent`) and lets
  # the on-page editor recognise existing styled spans instead of flagging them
  # as uneditable elements — matching the sidebar inputs.
  text:
    bold: true
    italic: true
    link: true
    removeformat: true
    styles: .cloudcannon/styles/editor.css
  # Block rich text. Drives on-page `data-editable="text" data-type="block"`
  # regions and their mirror inputs (the `content` field) via *block_richtext.
  block:
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    blockquote: true
    format: p h2 h3 h4
    removeformat: true
    styles: .cloudcannon/styles/editor.css
  # Markdown body (`@content`) editor for legal/blog bodies — full toolbar.
  content:
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    blockquote: true
    format: p h2 h3 h4
    image: true
    table: true
    snippet: true
    undo: true
    redo: true
    removeformat: true

