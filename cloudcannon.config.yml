version: latest

# ---------------------------------------------------------------------------
# Asset paths. Global uploads target the static dir (public/) — CloudCannon
# requires paths.uploads to begin with paths.static. Optimized site images live
# in src/assets/images; the image inputs below override per-input to upload
# there with static: "" so import.meta.glob resolves them.
# ---------------------------------------------------------------------------
paths:
  static: public
  uploads: public/images

markdown:
  engine: commonmark
  options:
    gfm: true # enables tables, strikethrough, etc. in blog markdown bodies
    breaks: false

