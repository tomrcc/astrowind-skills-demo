version: latest

# ---------------------------------------------------------------------------
# Asset paths. Site images live in src/assets/images (Astro-optimized) — image
# inputs below override to upload there with static: "" so import.meta.glob
# resolves them. public/ holds static files.
# ---------------------------------------------------------------------------
paths:
  static: public
  uploads: src/assets/images

markdown:
  engine: commonmark
  options:
    gfm: true # enables tables, strikethrough, etc. in blog markdown bodies
    breaks: false

# ---------------------------------------------------------------------------
# Shared select data
# ---------------------------------------------------------------------------
_select_data:
  button_variants:
    - primary
    - secondary
    - tertiary
    - link
  link_targets:
    - _self
    - _blank
  input_types:
    - text
    - email
    - tel
    - number

# ---------------------------------------------------------------------------
# Page-builder block list. Shared by pages / homes / landing collections.
# ---------------------------------------------------------------------------
_inputs:
  content_blocks:
    type: array
    label: Page sections
    options:
      structures: _structures.content_blocks
    comment: Add, reorder and remove the sections that make up this page.

# ---------------------------------------------------------------------------
# Editor toolbars
# ---------------------------------------------------------------------------
_editables:
  content:
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    blockquote: true
    format: p h2 h3 h4
    image: true
    table: true
    snippet: true
    undo: true
    redo: true
    removeformat: true

# ===========================================================================
# Shared sub-structures (referenced by name from block values below)
# ===========================================================================
_structures:
  actions:
    values:
      - label: Button
        icon: ads_click
        picker_preview:
          text:
            - Button
          icon:
            - ads_click
        preview:
          text:
            - key: text
            - Button
          icon:
            - ads_click
        value:
          text: ''
          href: '#'
          variant: secondary
          icon: ''
          target: ''
        _inputs:
          text:
            type: text
          href:
            type: text
            comment: Page path, anchor (#id) or full URL
          variant:
            type: select
            options:
              values: _select_data.button_variants
          icon:
